name: Testnet integration

# Hits the real Stellar testnet (Friendbot, Horizon, the testnet DEX) and waits
# out two 60-second claim windows, so it runs on main and on demand, not per PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testnet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: settlement on testnet
        run: pnpm test:testnet
        env:
          # A manual run must cover USDC: fail instead of skipping without a DEX quote.
          REQUIRE_USDC: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
