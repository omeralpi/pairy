name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      # tests/ci/* run below as their own named steps, so a failure there is
      # visible by name in the run.
      - name: unit tests
        run: pnpm vitest run --exclude "tests/ci/**"
      - name: no-secret-fields
        run: pnpm vitest run tests/ci/no-secret-fields.test.ts
      - name: coordination-purge-on-terminal
        run: pnpm vitest run tests/ci/coordination-purge-on-terminal.test.ts

      - name: build
        run: pnpm build
        env:
          # Build-time placeholders only; nothing connects to them.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci-not-used
          SESSION_SECRET: ci-build-placeholder-at-least-32-characters
